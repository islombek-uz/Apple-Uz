<div class="social-login">
  <div class="social-divider"><span>yoki</span></div>
  {% if social_auth.google %}
  <form method="post" action="{% url 'google_login' %}?process=login">
    {% csrf_token %}
    <button class="social-button" type="submit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.2c0-.68-.06-1.35-.18-2H12v3.79h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.91-4.2 2.91-7.18Z"/><path fill="#34A853" d="M12 21.75c2.63 0 4.84-.87 6.45-2.37l-3.15-2.45c-.87.58-1.98.92-3.3.92-2.54 0-4.7-1.71-5.47-4.02H3.28v2.53A9.75 9.75 0 0 0 12 21.75Z"/><path fill="#FBBC05" d="M6.53 13.83a5.86 5.86 0 0 1 0-3.66V7.64H3.28a9.75 9.75 0 0 0 0 8.72l3.25-2.53Z"/><path fill="#EA4335" d="M12 6.15c1.43 0 2.72.49 3.73 1.47l2.8-2.8C16.83 3.2 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.72 5.39l3.25 2.53c.77-2.31 2.93-4.02 5.47-4.02Z"/></svg>
      <span>Google orqali davom etish</span>
    </button>
  </form>
  {% else %}
  <a class="social-button" href="{% url 'social_login_start' 'google' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M21.35 12.2c0-.68-.06-1.35-.18-2H12v3.79h5.24a4.48 4.48 0 0 1-1.94 2.94v2.45h3.14c1.84-1.7 2.91-4.2 2.91-7.18Z"/><path fill="#34A853" d="M12 21.75c2.63 0 4.84-.87 6.45-2.37l-3.15-2.45c-.87.58-1.98.92-3.3.92-2.54 0-4.7-1.71-5.47-4.02H3.28v2.53A9.75 9.75 0 0 0 12 21.75Z"/><path fill="#FBBC05" d="M6.53 13.83a5.86 5.86 0 0 1 0-3.66V7.64H3.28a9.75 9.75 0 0 0 0 8.72l3.25-2.53Z"/><path fill="#EA4335" d="M12 6.15c1.43 0 2.72.49 3.73 1.47l2.8-2.8C16.83 3.2 14.63 2.25 12 2.25a9.75 9.75 0 0 0-8.72 5.39l3.25 2.53c.77-2.31 2.93-4.02 5.47-4.02Z"/></svg>
    <span>Google orqali davom etish</span>
  </a>
  {% endif %}
  {% if social_auth.telegram %}
  <form method="post" action="{% url 'telegram_login' %}?process=login">
    {% csrf_token %}
    <button class="social-button" type="submit">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#229ED9" d="M12 1.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21Z"/><path fill="#fff" d="m5.8 11.55 10.1-3.9c.47-.17.88.12.73.83l-1.72 8.1c-.13.58-.48.72-.97.45l-2.7-1.99-1.3 1.25c-.15.15-.28.28-.57.28l.19-2.75 5-4.52c.22-.2-.05-.3-.34-.12l-6.18 3.9-2.66-.83c-.58-.18-.59-.58.42-.97Z"/></svg>
      <span>Telegram orqali davom etish</span>
    </button>
  </form>
  {% else %}
  <a class="social-button" href="{% url 'social_login_start' 'telegram' %}">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#229ED9" d="M12 1.5a10.5 10.5 0 1 0 0 21 10.5 10.5 0 0 0 0-21Z"/><path fill="#fff" d="m5.8 11.55 10.1-3.9c.47-.17.88.12.73.83l-1.72 8.1c-.13.58-.48.72-.97.45l-2.7-1.99-1.3 1.25c-.15.15-.28.28-.57.28l.19-2.75 5-4.52c.22-.2-.05-.3-.34-.12l-6.18 3.9-2.66-.83c-.58-.18-.59-.58.42-.97Z"/></svg>
    <span>Telegram orqali davom etish</span>
  </a>
  {% endif %}
</div>
